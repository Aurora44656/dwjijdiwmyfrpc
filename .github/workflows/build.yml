                if [ "${XFRPC_TLS}" = "notls-hybrid" ]; then
                  # 半静态链接：仅静态链接 /usr/lib/libevent.a，动态复用路由器的 musl 与 libjson-c.so.5
                  cat > CMakeLists.txt << 'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.5...3.27)
          project(xfrp C)
          include_directories(/usr/include ${CMAKE_SOURCE_DIR})
          add_definitions(-D_GNU_SOURCE -Wall)
          add_executable(xfrpc
              main.c client.c config.c control.c ini.c toml_parser.c
              vendor/tomlc17/tomlc17.c msg.c xfrpc.c debug.c commandline.c
              utils.c common.c login.c proxy.c proxy_tcp.c tcpmux.c notls_stubs.c
          )
          target_compile_options(xfrpc PRIVATE -Wno-stringop-truncation)
          target_link_libraries(xfrpc PRIVATE /usr/lib/libevent.a json-c)
          install(TARGETS xfrpc DESTINATION bin)
          CMAKE_EOF

                  cmake -B build \
                    -DCMAKE_BUILD_TYPE=MinSizeRel \
                    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                    -DCMAKE_C_FLAGS="${CFLAGS_OPT}" \
                    -DCMAKE_C_FLAGS_MINSIZEREL="-Os -DNDEBUG" \
                    -DCMAKE_EXE_LINKER_FLAGS="${CFLAGS_OPT} -static-libgcc -Wl,--as-needed -Wl,--gc-sections -Wl,--build-id=none -Wl,-s"
                else
                  cat > CMakeLists.txt << 'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.5...3.27)
          project(xfrp C)
          set(CMAKE_FIND_LIBRARY_SUFFIXES ".a")
          set(BUILD_SHARED_LIBS OFF)
          set(CMAKE_MODULE_PATH ${CMAKE_MODULE_PATH} "${CMAKE_SOURCE_DIR}/cmake/Modules/")
          find_package(LibEvent REQUIRED)
          find_package(JSON-C REQUIRED)
          include_directories(${LIBEVENT_INCLUDE_DIR} ${JSON-C_INCLUDE_DIR} ${CMAKE_SOURCE_DIR})
          add_definitions(-D_GNU_SOURCE -Wall)
          add_executable(xfrpc
              main.c client.c config.c control.c ini.c toml_parser.c
              vendor/tomlc17/tomlc17.c msg.c xfrpc.c debug.c commandline.c
              utils.c common.c login.c proxy.c proxy_tcp.c tcpmux.c notls_stubs.c
          )
          target_compile_options(xfrpc PRIVATE -Wno-stringop-truncation)
          target_link_libraries(xfrpc PRIVATE ${LIBEVENT_LIB} ${JSON-C_LIBRARIES} m pthread)
          install(TARGETS xfrpc DESTINATION bin)
          CMAKE_EOF

                  cmake -B build \
                    -DCMAKE_BUILD_TYPE=MinSizeRel \
                    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                    -DCMAKE_C_FLAGS="${CFLAGS_OPT}" \
                    -DCMAKE_C_FLAGS_MINSIZEREL="-Os -DNDEBUG" \
                    -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
                    -DCMAKE_EXE_LINKER_FLAGS="-static ${CFLAGS_OPT} -Wl,--gc-sections -Wl,--build-id=none -Wl,-s"
                fi
              else
                if [ "${XFRPC_TLS}" = "slim" ]; then
                  awk '
                    /^int https2http_init_service\(/ {
                      print "int https2http_init_service(struct proxy_service *ps) { (void)ps; return -1; }"
                      skip=1; next
                    }
                    skip && /^\}$/ { skip=0; next }
                    !skip { print }
                  ' plugins/https2http.c > plugins/https2http.c.tmp && mv plugins/https2http.c.tmp plugins/https2http.c
                fi

                sed -i "s/-O2/-Os/g; /-Werror/d" CMakeLists.txt
                sed -i "/EXTERNAL_LIBS/,/)/ { /SSL_LIBRARIES/d; s/LIBEVENT_LIB}/LIBEVENT_LIB} \${SSL_LIBRARIES}/; }" CMakeLists.txt

                cmake -B build \
                  -DCMAKE_BUILD_TYPE=MinSizeRel \
                  -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                  -DCMAKE_C_FLAGS="${CFLAGS_OPT}" \
                  -DCMAKE_C_FLAGS_MINSIZEREL="-Os -DNDEBUG" \
                  -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
                  -DCMAKE_EXE_LINKER_FLAGS="-static ${CFLAGS_OPT} -Wl,--gc-sections -Wl,--build-id=none -Wl,-s" \
                  -DOPENSSL_USE_STATIC_LIBS=ON \
                  -DUSE_WOLFSSL=OFF \
                  -DENABLE_QUIC=OFF \
                  -DBUILD_STATIC=ON \
                  -DDEBUG=OFF
              fi

              cmake --build build -j"$(nproc)"

              BIN=$(find build -maxdepth 3 -type f -name xfrpc -perm -100 | head -n 1)
              test -n "${BIN}"
              strip --strip-all --remove-section=.comment --remove-section=.note "${BIN}"

              if [ "${XFRPC_TLS}" = "notls-hybrid" ]; then
                echo "=== Dynamic dependencies (notls-hybrid) ==="
                readelf -d "${BIN}" | grep NEEDED
                ! readelf -d "${BIN}" | grep -Eq "libevent|libssl|libcrypto|libz|libgcc_s"
              fi

              # 在 musl 容器内直接采集版本号，兼容半静态与全静态模式
              ("${BIN}" -v 2>&1 || true) | head -n 1 > /out/.ver_xfrpc
              test -s /out/.ver_xfrpc

              cp "${BIN}" /out/xfrpc
              chmod 755 /out/xfrpc
              chown "${HOST_UID}:${HOST_GID}" /out/xfrpc /out/.ver_xfrpc
          DOCKER_EOF

          file out/xfrpc
          if [ "${XFRPC_TLS}" = "notls-hybrid" ]; then
            file out/xfrpc | grep -Eq "dynamically linked"
          else
            file out/xfrpc | grep -Eq "statically linked|static-pie linked"
          fi

      - name: Build cloudflared (arm64)
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          VER=${TAG#v}
          echo "Building cloudflared ${TAG}..."
          git clone --depth 1 --branch "${TAG}" https://github.com/cloudflare/cloudflared.git
          cd cloudflared
          BUILD_DATE=$(date -u '+%Y-%m-%d-%H:%M UTC')
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOARM64=v8.0,crypto GOTOOLCHAIN=auto GOFIPS140=off \
            go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X 'main.Version=${VER}' -X 'main.BuildTime=${BUILD_DATE}' -X 'github.com/cloudflare/cloudflared/cmd/cloudflared/updater.BuiltForPackageManager=ImmortalWrt'" \
            -o ../out/cloudflared ./cmd/cloudflared

      - name: Verify Binaries & Optional UPX
        run: |
          mkdir -p meta
          for f in xray frpc xfrpc cloudflared; do
            ls -lh "out/$f" | awk '{print $5}' > "meta/raw_$f"
          done

          # 原生 ARM64 环境直接运行校验可执行性与版本号（xfrpc 半静态版使用 musl 容器内采集的版本号）
          ./out/xray version | sed -n '1p' > meta/ver_xray
          ./out/frpc -v > meta/ver_frpc
          if [ -s out/.ver_xfrpc ]; then
            mv out/.ver_xfrpc meta/ver_xfrpc
          else
            (./out/xfrpc -v 2>&1 || true) | head -n 1 > meta/ver_xfrpc
          fi
          test -s meta/ver_xfrpc
          ./out/cloudflared -v > meta/ver_cloudflared

          if [ "${USE_UPX}" = "true" ]; then
            upx --best --lzma out/xray out/frpc out/xfrpc out/cloudflared
            upx -t out/xray out/frpc out/xfrpc out/cloudflared
          fi

      - name: Output Summary
        run: |
          {
            echo "### 编译结果（Runner：\`ubuntu-24.04-arm\` ｜ UPX：\`${USE_UPX}\` ｜ xfrpc 模式：\`${XFRPC_TLS}\`）"
            echo ""
            if [ "${USE_UPX}" = "true" ]; then
              echo "| 程序 | 压缩前 | 最终体积 | 版本校验 |"
              echo "| :--- | :--- | :--- | :--- |"
              for f in xray frpc xfrpc cloudflared; do
                echo "| \`$f\` | $(cat meta/raw_$f) | **$(ls -lh out/$f | awk '{print $5}')** | \`$(tr -d '\r\n' < meta/ver_$f)\` |"
              done
            else
              echo "| 程序 | 最终体积 | 版本校验 |"
              echo "| :--- | :--- | :--- |"
              for f in xray frpc xfrpc cloudflared; do
                echo "| \`$f\` | **$(cat meta/raw_$f)** | \`$(tr -d '\r\n' < meta/ver_$f)\` |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          name: arm64-binaries-${{ inputs.xfrpc_tls }}-${{ inputs.use_upx && 'upx' || 'no-upx' }}
          path: out/
          if-no-files-found: error
