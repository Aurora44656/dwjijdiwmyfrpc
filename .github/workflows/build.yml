name: Build Mini Router Binaries (ARM64)

on:
  workflow_dispatch:
    inputs:
      use_upx:
        description: '启用 UPX 压缩（放 /tmp 运行请保持取消勾选；放闪存 /overlay 再勾选）'
        type: boolean
        default: false
      xfrpc_tls:
        description: 'xfrpc 编译模式（notls-hybrid 半静态 ~160K；notls-static 全静态 ~300K；slim 全静态 TLS ~850K；alpine 最快 ~4.5M）'
        type: choice
        default: notls-hybrid
        options:
          - notls-hybrid
          - notls-static
          - slim
          - alpine
      xfrpc_ref:
        description: 'xfrpc 版本 Tag（默认锁定已验证的 5.11.1004；填 latest 自动拉取最新 Release）'
        type: string
        default: '5.11.1004'
      xfrpc_4k_page:
        description: '启用 xfrpc 4096 (4 KB) 页对齐（去除 ARM64 默认 64 KB 段填充，仅适用于 4 KB 页内核的路由器）'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USE_UPX: ${{ inputs.use_upx }}
      XFRPC_TLS: ${{ inputs.xfrpc_tls }}
      XFRPC_REF: ${{ inputs.xfrpc_ref }}
      XFRPC_4K_PAGE: ${{ inputs.xfrpc_4k_page }}

    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Install Optional UPX (arm64)
        if: ${{ inputs.use_upx }}
        run: |
          UPX_TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/upx/upx/releases/latest | jq -r .tag_name)
          UPX_VER=${UPX_TAG#v}
          curl -fsSL "https://github.com/upx/upx/releases/download/${UPX_TAG}/upx-${UPX_VER}-arm64_linux.tar.xz" | tar -xJ
          sudo mv "upx-${UPX_VER}-arm64_linux/upx" /usr/local/bin/upx
          upx --version

      - name: Build Xray (arm64)
        run: |
          mkdir -p out
          TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          echo "Building Xray ${TAG}..."
          git clone --depth 1 --branch "${TAG}" https://github.com/XTLS/Xray-core.git
          cd Xray-core
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOARM64=v8.0,crypto GOTOOLCHAIN=auto \
            go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X github.com/xtls/xray-core/core.build=${TAG}" \
            -o ../out/xray ./main

      - name: Build frpc (arm64, no-web)
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/fatedier/frp/releases/latest | jq -r .tag_name)
          VER=${TAG#v}
          echo "Building frpc ${TAG}..."
          git clone --depth 1 --branch "${TAG}" https://github.com/fatedier/frp.git
          cd frp
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOARM64=v8.0,crypto GOTOOLCHAIN=auto \
            go build -trimpath -buildvcs=false -tags "frpc,noweb" \
            -ldflags="-s -w -buildid= -X github.com/fatedier/frp/pkg/util/version.version=${VER}" \
            -o ../out/frpc ./cmd/frpc

      - name: Build xfrpc (arm64, musl)
        run: |
          mkdir -p out
          if [ -z "${XFRPC_REF}" ] || [ "${XFRPC_REF}" = "latest" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/liudf0716/xfrpc/releases/latest | jq -r .tag_name)
            if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
              TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/liudf0716/xfrpc/tags | jq -r '.[0].name')
            fi
          else
            TAG="${XFRPC_REF}"
          fi
          echo "Building xfrpc ${TAG} (Mode: ${XFRPC_TLS}, 4K page: ${XFRPC_4K_PAGE})..."

          docker run --rm -i \
            -v "${PWD}/out:/out" \
            -e XFRPC_TAG="${TAG}" \
            -e XFRPC_TLS="${XFRPC_TLS}" \
            -e XFRPC_4K_PAGE="${XFRPC_4K_PAGE}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            alpine:3.24 sh -eux << 'DOCKER_EOF'
              apk add --no-cache build-base cmake pkgconfig git linux-headers

              CFLAGS_OPT="-Os -ffunction-sections -fdata-sections -fno-asynchronous-unwind-tables -fno-unwind-tables -fmerge-all-constants -fno-ident -flto=auto -ffat-lto-objects -march=armv8-a+crc+crypto -mtune=cortex-a53"
              COMPAT_CFLAGS="-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=strict-prototypes"
              PAGE_LDFLAGS=""
              if [ "${XFRPC_4K_PAGE}" = "true" ]; then
                PAGE_LDFLAGS="-Wl,-z,max-page-size=4096 -Wl,-z,noseparate-code"
              fi

              # 1. 准备 libjson-c（notls-hybrid 直接动态链接系统 libjson-c.so.5；其余全静态模式从源码编 libjson-c.a）
              if [ "${XFRPC_TLS}" = "notls-hybrid" ]; then
                apk add --no-cache json-c-dev
              else
                git clone --depth 1 --branch json-c-0.18-20240915 https://github.com/json-c/json-c.git /tmp/json-c
                cmake -S /tmp/json-c -B /tmp/json-c/build \
                  -DCMAKE_BUILD_TYPE=MinSizeRel \
                  -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                  -DCMAKE_INSTALL_PREFIX=/usr \
                  -DCMAKE_INSTALL_LIBDIR=lib \
                  -DCMAKE_C_FLAGS="${CFLAGS_OPT}" \
                  -DCMAKE_C_FLAGS_MINSIZEREL="-Os -DNDEBUG" \
                  -DBUILD_SHARED_LIBS=OFF \
                  -DBUILD_STATIC_LIBS=ON \
                  -DBUILD_TESTING=OFF \
                  -DBUILD_APPS=OFF \
                  -DDISABLE_WERROR=ON \
                  -DDISABLE_EXTRA_LIBS=ON
                cmake --build /tmp/json-c/build -j"$(nproc)"
                cmake --install /tmp/json-c/build
              fi

              # 2. 按模式准备 libevent / OpenSSL / zlib
              if [ "${XFRPC_TLS}" = "notls-hybrid" ] || [ "${XFRPC_TLS}" = "notls-static" ]; then
                git clone --depth 1 --branch release-2.1.12-stable https://github.com/libevent/libevent.git /tmp/libevent
                cmake -S /tmp/libevent -B /tmp/libevent/build \
                  -DCMAKE_BUILD_TYPE=MinSizeRel \
                  -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                  -DCMAKE_INSTALL_PREFIX=/usr \
                  -DCMAKE_INSTALL_LIBDIR=lib \
                  -DCMAKE_C_FLAGS="${CFLAGS_OPT} ${COMPAT_CFLAGS}" \
                  -DCMAKE_C_FLAGS_MINSIZEREL="-Os -DNDEBUG" \
                  -DEVENT__LIBRARY_TYPE=STATIC \
                  -DEVENT__DISABLE_OPENSSL=ON \
                  -DEVENT__DISABLE_DEBUG_MODE=ON \
                  -DEVENT__DISABLE_TESTS=ON \
                  -DEVENT__DISABLE_REGRESS=ON \
                  -DEVENT__DISABLE_SAMPLES=ON \
                  -DEVENT__DISABLE_BENCHMARK=ON
                cmake --build /tmp/libevent/build -j"$(nproc)"
                cmake --install /tmp/libevent/build
              elif [ "${XFRPC_TLS}" = "slim" ]; then
                apk add --no-cache perl zlib-dev zlib-static

                git clone --depth 1 --branch OpenSSL_1_1_1w https://github.com/openssl/openssl.git /tmp/openssl
                cd /tmp/openssl
                ./Configure linux-aarch64 \
                  --prefix=/usr \
                  --libdir=lib \
                  --openssldir=/etc/ssl \
                  no-shared no-dso no-engine no-async no-tests no-ui-console no-err \
                  no-deprecated no-autoalginit no-autoerrinit \
                  no-ssl3 no-ssl3-method no-tls1 no-tls1-method no-tls1_1 no-tls1_1-method \
                  no-chacha no-poly1305 \
                  no-aria no-bf no-blake2 no-camellia no-cast no-cmac no-cms no-comp \
                  no-ct no-des no-dh no-dsa no-dtls no-ec2m no-filenames no-gost \
                  no-heartbeats no-idea no-md2 no-md4 no-mdc2 no-multiblock \
                  no-nextprotoneg no-ocb no-ocsp no-psk no-rc2 no-rc4 no-rc5 no-rdrand \
                  no-rfc3779 no-rmd160 no-scrypt no-seed no-siphash no-sm2 no-sm3 \
                  no-sm4 no-srp no-srtp no-ts no-whirlpool \
                  ${CFLAGS_OPT} ${COMPAT_CFLAGS}

                sed -i "s/-O3/-Os/g; s/-DECP_NISTZ256_ASM//g" Makefile
                grep -q -- "-ffunction-sections" Makefile

                sed -i "/ecx448_/d; /ed448_/d" crypto/asn1/ameth_lib.c crypto/evp/pmeth_lib.c
                sed -i "/EVP_sha3_/d; /EVP_shake/d; /EVP_sha512_/d" crypto/evp/c_alld.c
                sed -i "/_cbc_hmac_/d; /_ccm/d; /_xts/d; /_wrap/d; /_cfb1(/d; /_cfb8(/d; /_ofb/d; /_ecb/d; /aes_192/d" crypto/evp/c_allc.c

                make -j"$(nproc)" build_libs
                make install_dev

                git clone --depth 1 --branch release-2.1.12-stable https://github.com/libevent/libevent.git /tmp/libevent
                cmake -S /tmp/libevent -B /tmp/libevent/build \
                  -DCMAKE_BUILD_TYPE=MinSizeRel \
                  -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                  -DCMAKE_INSTALL_PREFIX=/usr \
                  -DCMAKE_INSTALL_LIBDIR=lib \
                  -DCMAKE_C_FLAGS="${CFLAGS_OPT} ${COMPAT_CFLAGS}" \
                  -DCMAKE_C_FLAGS_MINSIZEREL="-Os -DNDEBUG" \
                  -DEVENT__LIBRARY_TYPE=STATIC \
                  -DEVENT__DISABLE_DEBUG_MODE=ON \
                  -DEVENT__DISABLE_TESTS=ON \
                  -DEVENT__DISABLE_REGRESS=ON \
                  -DEVENT__DISABLE_SAMPLES=ON \
                  -DEVENT__DISABLE_BENCHMARK=ON \
                  -DOPENSSL_USE_STATIC_LIBS=ON
                cmake --build /tmp/libevent/build -j"$(nproc)"
                cmake --install /tmp/libevent/build
              else
                apk add --no-cache \
                  zlib-dev zlib-static \
                  libevent-dev libevent-static \
                  openssl-dev openssl-libs-static
              fi

              # 3. 克隆并编译 xfrpc
              git clone --depth 1 --branch "${XFRPC_TAG}" --recurse-submodules https://github.com/liudf0716/xfrpc.git /tmp/xfrpc
              cd /tmp/xfrpc

              # 修复原版 xfrpc 仅支持 IPv4 (AF_INET) 导致无法直连 IPv6 frps 的硬伤（全模式生效）
              awk '
                /^int is_valid_ip_address\(/ {
                  print "int is_valid_ip_address(const char *ip_address)"
                  print "{"
                  print "\tif (!ip_address || !*ip_address) return 0;"
                  print "\tchar buf[64];"
                  print "\tsize_t len = strlen(ip_address);"
                  print "\tif (ip_address[0] == '\''['\'' && len > 2 && ip_address[len - 1] == '\'']'\'' && len - 2 < sizeof(buf)) {"
                  print "\t\tmemcpy(buf, ip_address + 1, len - 2);"
                  print "\t\tbuf[len - 2] = '\''\\0'\'';"
                  print "\t\tip_address = buf;"
                  print "\t}"
                  print "\tstruct in_addr a4;"
                  print "\tstruct in6_addr a6;"
                  print "\treturn inet_pton(AF_INET, ip_address, &a4) == 1 || inet_pton(AF_INET6, ip_address, &a6) == 1;"
                  print "}"
                  skip=1; next
                }
                skip && /^\}$/ { skip=0; next }
                !skip { print }
              ' utils.c > utils.c.tmp && mv utils.c.tmp utils.c

              awk '
                /if \(is_valid_ip_address\(name\)\) \{/ {
                  print "\tif (is_valid_ip_address(name)) {"
                  print "\t\tchar ipbuf[64];"
                  print "\t\tconst char *ipstr = name;"
                  print "\t\tsize_t ilen = strlen(name);"
                  print "\t\tif (name[0] == '\''['\'' && ilen > 2 && name[ilen - 1] == '\'']'\'' && ilen - 2 < sizeof(ipbuf)) {"
                  print "\t\t\tmemcpy(ipbuf, name + 1, ilen - 2);"
                  print "\t\t\tipbuf[ilen - 2] = '\''\\0'\'';"
                  print "\t\t\tipstr = ipbuf;"
                  print "\t\t}"
                  print "\t\tstruct sockaddr_storage ss;"
                  print "\t\tmemset(&ss, 0, sizeof(ss));"
                  print "\t\tint slen = 0;"
                  print "\t\tstruct in_addr a4;"
                  print "\t\tstruct in6_addr a6;"
                  print "\t\tif (inet_pton(AF_INET, ipstr, &a4) == 1) {"
                  print "\t\t\tstruct sockaddr_in *sin = (struct sockaddr_in *)&ss;"
                  print "\t\t\tsin->sin_family = AF_INET;"
                  print "\t\t\tsin->sin_addr = a4;"
                  print "\t\t\tsin->sin_port = htons(port);"
                  print "\t\t\tslen = (int)sizeof(*sin);"
                  print "\t\t} else if (inet_pton(AF_INET6, ipstr, &a6) == 1) {"
                  print "\t\t\tstruct sockaddr_in6 *sin6 = (struct sockaddr_in6 *)&ss;"
                  print "\t\t\tsin6->sin6_family = AF_INET6;"
                  print "\t\t\tsin6->sin6_addr = a6;"
                  print "\t\t\tsin6->sin6_port = htons(port);"
                  print "\t\t\tslen = (int)sizeof(*sin6);"
                  print "\t\t}"
                  print "\t\tif (slen == 0 || bufferevent_socket_connect(bev, (struct sockaddr *)&ss, slen) < 0) {"
                  print "\t\t\tdebug(LOG_ERR, \"Direct IP connection failed to %s:%d\", name, port);"
                  print "\t\t\tbufferevent_free(bev);"
                  print "\t\t\treturn NULL;"
                  print "\t\t}"
                  print "\t}"
                  skip=1; next
                }
                skip && /^\t\}$/ { skip=0; next }
                {
                  if (!skip) {
                    gsub(/AF_INET, name, port\)/, "AF_UNSPEC, name, port)")
                    print
                  }
                }
              ' control.c > control.c.tmp && mv control.c.tmp control.c

              if [ "${XFRPC_TLS}" = "notls-hybrid" ] || [ "${XFRPC_TLS}" = "notls-static" ]; then
                # 彻底移除 OpenSSL、zlib、mongoose、全部插件及未用协议（仅保留 TOML/INI + auth.token MD5 + TCP/TCPMux）
                cat > ssl_compat.h << 'HDR_EOF'
          #ifndef XFRPC_SSL_COMPAT_H
          #define XFRPC_SSL_COMPAT_H
          #include <stddef.h>
          #include <stdint.h>
          typedef struct mini_cfb_ctx EVP_CIPHER_CTX;
          typedef void EVP_MD;
          typedef void EVP_CIPHER;
          const EVP_MD *EVP_sha1(void);
          const EVP_CIPHER *EVP_aes_128_cfb(void);
          int PKCS5_PBKDF2_HMAC(const char *pass, int passlen, const unsigned char *salt, int saltlen, int iter, const EVP_MD *digest, int keylen, unsigned char *out);
          int RAND_bytes(unsigned char *buf, int num);
          EVP_CIPHER_CTX *EVP_CIPHER_CTX_new(void);
          void EVP_CIPHER_CTX_free(EVP_CIPHER_CTX *ctx);
          int EVP_EncryptInit_ex(EVP_CIPHER_CTX *ctx, const EVP_CIPHER *type, void *impl, const unsigned char *key, const unsigned char *iv);
          int EVP_EncryptUpdate(EVP_CIPHER_CTX *ctx, unsigned char *out, int *outl, const unsigned char *in, int inl);
          int EVP_EncryptFinal_ex(EVP_CIPHER_CTX *ctx, unsigned char *out, int *outl);
          int EVP_DecryptInit_ex(EVP_CIPHER_CTX *ctx, const EVP_CIPHER *type, void *impl, const unsigned char *key, const unsigned char *iv);
          int EVP_DecryptUpdate(EVP_CIPHER_CTX *ctx, unsigned char *out, int *outl, const unsigned char *in, int inl);
          int EVP_DecryptFinal_ex(EVP_CIPHER_CTX *ctx, unsigned char *out, int *outl);
          #endif
          HDR_EOF

                sed -i '1i #include <unistd.h>' client.c
                sed -i '/<openssl\//d; /<event2\/bufferevent_ssl.h>/d; /<zlib.h>/d' client.c tls.h plugins/https2http.h
                sed -i '/#define XFRPC_TLS_H/a unsigned long ERR_get_error(void);\nvoid ERR_error_string_n(unsigned long e, char *buf, size_t len);' tls.h

                awk '
                  /if \(client->local_proxy_bev && ps->plugin &&/ { skip=1; next }
                  skip && /^\t\} else \{/ { skip=0 }
                  !skip { print }
                ' client.c > client.c.tmp && mv client.c.tmp client.c

                awk '
                  /^static int calc_md5\(/ {
                    print "extern int notls_md5(const uint8_t *data, size_t len, uint8_t digest[16]);"
                    print "static int calc_md5(const uint8_t *data, int datalen, uint8_t *digest)"
                    print "{"
                    print "\tif (!data || !digest || datalen <= 0) return -1;"
                    print "\treturn notls_md5(data, (size_t)datalen, digest);"
                    print "}"
                    skip=1; next
                  }
                  skip && /^\}$/ { skip=0; next }
                  !skip { print }
                ' msg.c > msg.c.tmp && mv msg.c.tmp msg.c

                cat > notls_stubs.c << 'STUB_EOF'
          #include <stddef.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <event2/event.h>
          #include <event2/bufferevent.h>
          #include <event2/buffer.h>
          #include "client.h"
          #include "config.h"
          #include "proxy.h"
          #include "tls.h"
          #include "crypto.h"
          #include "crypto_stream.h"
          #include "aead_stream.h"
          #include "wire_v2.h"
          #include "oidc_auth.h"
          #include "ws_transport.h"
          #include "health_check.h"
          #include "zip.h"
          #include "tcp_redir.h"
          #include "visitor.h"
          #include "xtcp_client.h"
          #include "xtcp_visitor.h"
          #include "nathole.h"
          #include "quic_client_transport.h"
          #include "plugins/https2http.h"
          #include "plugins/std_plugins.h"
          #include "plugins/httpd.h"
          #include "plugins/telnetd.h"
          #include "plugins/instaloader.h"
          #include "plugins/youtubedl.h"
          #include "vendor/snappy/snappy.h"

          /* RFC 1321 MD5 for frp auth.token privilege_key */
          static void md5_transform(uint32_t s[4], const uint8_t blk[64]) {
              static const uint32_t k[64] = {
                  0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,
                  0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,
                  0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,
                  0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,
                  0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,
                  0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,
                  0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,
                  0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391
              };
              static const uint8_t r[64] = {
                  7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
                  5, 9,14,20,5, 9,14,20,5, 9,14,20,5, 9,14,20,
                  4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
                  6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21
              };
              uint32_t m[16], a = s[0], b = s[1], c = s[2], d = s[3];
              for (int i = 0; i < 16; i++)
                  m[i] = (uint32_t)blk[i*4] | ((uint32_t)blk[i*4+1] << 8) |
                         ((uint32_t)blk[i*4+2] << 16) | ((uint32_t)blk[i*4+3] << 24);
              for (int i = 0; i < 64; i++) {
                  uint32_t f, g;
                  if (i < 16)      { f = (b & c) | ((~b) & d); g = (uint32_t)i; }
                  else if (i < 32) { f = (d & b) | ((~d) & c); g = (uint32_t)(5*i + 1) & 15; }
                  else if (i < 48) { f = b ^ c ^ d;            g = (uint32_t)(3*i + 5) & 15; }
                  else             { f = c ^ (b | (~d));       g = (uint32_t)(7*i) & 15; }
                  uint32_t tmp = d;
                  d = c; c = b;
                  uint32_t x = a + f + k[i] + m[g];
                  b += (x << r[i]) | (x >> (32 - r[i]));
                  a = tmp;
              }
              s[0] += a; s[1] += b; s[2] += c; s[3] += d;
          }

          int notls_md5(const uint8_t *data, size_t len, uint8_t digest[16]) {
              uint32_t s[4] = { 0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476 };
              uint8_t buf[64];
              size_t i = 0;
              while (i + 64 <= len) { md5_transform(s, data + i); i += 64; }
              size_t rem = len - i;
              memcpy(buf, data + i, rem);
              buf[rem++] = 0x80;
              if (rem > 56) {
                  memset(buf + rem, 0, 64 - rem);
                  md5_transform(s, buf);
                  rem = 0;
              }
              memset(buf + rem, 0, 56 - rem);
              uint64_t bits = (uint64_t)len * 8;
              for (int j = 0; j < 8; j++) buf[56 + j] = (uint8_t)(bits >> (j * 8));
              md5_transform(s, buf);
              for (int j = 0; j < 4; j++) {
                  digest[j*4]   = (uint8_t)(s[j]);
                  digest[j*4+1] = (uint8_t)(s[j] >> 8);
                  digest[j*4+2] = (uint8_t)(s[j] >> 16);
                  digest[j*4+3] = (uint8_t)(s[j] >> 24);
              }
              return 0;
          }

          int tls_init(void) { return 0; }
          struct bufferevent *tls_wrap_bev(struct event_base *b, struct bufferevent *bev) { (void)b; return bev; }
          void tls_cleanup(void) {}
          int tls_is_enabled(void) { return 0; }
          void tls_log_errors(const char *ctx) { (void)ctx; }
          int tls_load_certs_to_ctx(void *ctx) { (void)ctx; return -1; }
