          const EVP_CIPHER *EVP_aes_128_cfb(void) { return (const EVP_CIPHER *)1; }
          int PKCS5_PBKDF2_HMAC(const char *pass, int passlen, const unsigned char *salt, int saltlen, int iter, const EVP_MD *digest, int keylen, unsigned char *out) {
              (void)digest;
              uint8_t sb[128], u[20], t[20];
              if (!out || keylen <= 0 || keylen > 20 || saltlen < 0 || (size_t)saltlen + 4 > sizeof(sb)) return 0;
              memcpy(sb, salt, (size_t)saltlen);
              sb[saltlen]=0; sb[saltlen+1]=0; sb[saltlen+2]=0; sb[saltlen+3]=1;
              hmac_sha1((const uint8_t *)pass, (size_t)passlen, sb, (size_t)saltlen + 4, u);
              memcpy(t, u, 20);
              for (int i = 1; i < iter; i++) {
                  hmac_sha1((const uint8_t *)pass, (size_t)passlen, u, 20, u);
                  for (int j = 0; j < 20; j++) t[j] ^= u[j];
              }
              memcpy(out, t, (size_t)keylen);
              return 1;
          }
          int RAND_bytes(unsigned char *buf, int num) {
              if (!buf || num <= 0) return 0;
              int fd = open("/dev/urandom", O_RDONLY);
              if (fd < 0) return 0;
              int got = 0;
              while (got < num) {
                  ssize_t r = read(fd, buf + got, (size_t)(num - got));
                  if (r <= 0) { close(fd); return 0; }
                  got += (int)r;
              }
              close(fd);
              return 1;
          }
