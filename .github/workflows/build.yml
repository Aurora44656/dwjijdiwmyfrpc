          static uint8_t aes_xt(uint8_t x) { return (uint8_t)((x << 1) ^ ((x & 0x80) ? 0x1b : 0)); }
          static void aes128_keyexp(const uint8_t key[16], uint8_t rk[176]) {
              static const uint8_t rcon[10] = {1,2,4,8,16,32,64,128,27,54};
              memcpy(rk, key, 16);
              for (int i = 4; i < 44; i++) {
                  uint8_t t[4]; memcpy(t, rk + (i - 1)*4, 4);
                  if (i % 4 == 0) {
                      uint8_t tmp = t[0]; t[0] = aes_sbox[t[1]] ^ rcon[i/4 - 1];
                      t[1] = aes_sbox[t[2]]; t[2] = aes_sbox[t[3]]; t[3] = aes_sbox[tmp];
                  }
                  for (int j = 0; j < 4; j++) rk[i*4 + j] = rk[(i - 4)*4 + j] ^ t[j];
              }
          }
          static void aes128_enc_blk(const uint8_t rk[176], const uint8_t in[16], uint8_t out[16]) {
              uint8_t s[16];
              for (int i = 0; i < 16; i++) s[i] = in[i] ^ rk[i];
              for (int r = 1; r <= 10; r++) {
                  uint8_t t[16];
                  for (int i = 0; i < 16; i++) t[i] = aes_sbox[s[i]];
                  s[0]=t[0];  s[1]=t[5];  s[2]=t[10]; s[3]=t[15];
                  s[4]=t[4];  s[5]=t[9];  s[6]=t[14]; s[7]=t[3];
                  s[8]=t[8];  s[9]=t[13]; s[10]=t[2]; s[11]=t[7];
                  s[12]=t[12];s[13]=t[1]; s[14]=t[6]; s[15]=t[11];
                  if (r < 10) {
                      for (int c = 0; c < 4; c++) {
                          uint8_t *p = s + c*4, a0=p[0], a1=p[1], a2=p[2], a3=p[3], x=a0^a1^a2^a3;
                          p[0] ^= x ^ aes_xt(a0^a1); p[1] ^= x ^ aes_xt(a1^a2);
                          p[2] ^= x ^ aes_xt(a2^a3); p[3] ^= x ^ aes_xt(a3^a0);
                      }
                  }
                  for (int i = 0; i < 16; i++) s[i] ^= rk[r*16 + i];
              }
              memcpy(out, s, 16);
          }
          struct mini_cfb_ctx { uint8_t rk[176], iv[16]; int num; };
          static void cfb128_crypt(struct mini_cfb_ctx *c, const uint8_t *in, uint8_t *out, size_t len, int enc) {
              int n = c->num;
              for (size_t i = 0; i < len; i++) {
                  if (n == 0) aes128_enc_blk(c->rk, c->iv, c->iv);
                  if (enc) { uint8_t ct = in[i] ^ c->iv[n]; c->iv[n] = ct; out[i] = ct; }
                  else     { uint8_t ct = in[i]; out[i] = ct ^ c->iv[n]; c->iv[n] = ct; }
                  n = (n + 1) & 15;
              }
              c->num = n;
          }
