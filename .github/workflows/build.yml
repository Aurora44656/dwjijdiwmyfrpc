          /* Pure-C SHA-1 + PBKDF2-HMAC-SHA1 + AES-128-CFB128 for frp v1 control channel (zero OpenSSL) */
          typedef struct { uint32_t h[5]; uint64_t len; uint8_t buf[64]; size_t idx; } mini_sha1_ctx;
          static uint32_t rol32(uint32_t x, int n) { return (x << n) | (x >> (32 - n)); }
          static void sha1_blk(uint32_t h[5], const uint8_t b[64]) {
              uint32_t w[80];
              for (int i = 0; i < 16; i++)
                  w[i] = ((uint32_t)b[i*4]<<24)|((uint32_t)b[i*4+1]<<16)|((uint32_t)b[i*4+2]<<8)|b[i*4+3];
              for (int i = 16; i < 80; i++) w[i] = rol32(w[i-3]^w[i-8]^w[i-14]^w[i-16], 1);
              uint32_t a=h[0], bb=h[1], c=h[2], d=h[3], e=h[4];
              for (int i = 0; i < 80; i++) {
                  uint32_t f, k;
                  if (i < 20)      { f = (bb & c) | ((~bb) & d); k = 0x5A827999; }
                  else if (i < 40) { f = bb ^ c ^ d;             k = 0x6ED9EBA1; }
                  else if (i < 60) { f = (bb & c) | (bb & d) | (c & d); k = 0x8F1BBCDC; }
                  else             { f = bb ^ c ^ d;             k = 0xCA62C1D6; }
                  uint32_t t = rol32(a, 5) + f + e + k + w[i];
                  e = d; d = c; c = rol32(bb, 30); bb = a; a = t;
              }
              h[0]+=a; h[1]+=bb; h[2]+=c; h[3]+=d; h[4]+=e;
          }
          static void sha1_init(mini_sha1_ctx *c) {
              c->h[0]=0x67452301; c->h[1]=0xEFCDAB89; c->h[2]=0x98BADCFE; c->h[3]=0x10325476; c->h[4]=0xC3D2E1F0;
              c->len = 0; c->idx = 0;
          }
          static void sha1_upd(mini_sha1_ctx *c, const uint8_t *d, size_t n) {
              c->len += n;
              while (n--) {
                  c->buf[c->idx++] = *d++;
                  if (c->idx == 64) { sha1_blk(c->h, c->buf); c->idx = 0; }
              }
          }
          static void sha1_fin(mini_sha1_ctx *c, uint8_t out[20]) {
              uint64_t bits = c->len * 8;
              c->buf[c->idx++] = 0x80;
              if (c->idx > 56) { memset(c->buf + c->idx, 0, 64 - c->idx); sha1_blk(c->h, c->buf); c->idx = 0; }
              memset(c->buf + c->idx, 0, 56 - c->idx);
              for (int i = 0; i < 8; i++) c->buf[56 + i] = (uint8_t)(bits >> (56 - i*8));
              sha1_blk(c->h, c->buf);
              for (int i = 0; i < 5; i++) {
                  out[i*4]   = (uint8_t)(c->h[i] >> 24); out[i*4+1] = (uint8_t)(c->h[i] >> 16);
                  out[i*4+2] = (uint8_t)(c->h[i] >> 8);  out[i*4+3] = (uint8_t)(c->h[i]);
              }
          }
          static void hmac_sha1(const uint8_t *k, size_t kl, const uint8_t *m, size_t ml, uint8_t out[20]) {
              uint8_t kb[64], pad[64], inner[20];
              memset(kb, 0, 64);
              if (kl > 64) { mini_sha1_ctx c; sha1_init(&c); sha1_upd(&c, k, kl); sha1_fin(&c, kb); }
              else memcpy(kb, k, kl);
              for (int i = 0; i < 64; i++) pad[i] = kb[i] ^ 0x36;
              mini_sha1_ctx c; sha1_init(&c); sha1_upd(&c, pad, 64); sha1_upd(&c, m, ml); sha1_fin(&c, inner);
              for (int i = 0; i < 64; i++) pad[i] = kb[i] ^ 0x5c;
              sha1_init(&c); sha1_upd(&c, pad, 64); sha1_upd(&c, inner, 20); sha1_fin(&c, out);
          }
